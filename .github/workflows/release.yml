name: Release 悦诉客服

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  APP_NAME: 悦诉客服
  PNPM_VERSION: 8

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ env.APP_NAME }} ${{ github.ref_name }}
          draft: false
          prerelease: false

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install WiX Toolset (required for .msi)
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          if (Test-Path "C:\Program Files (x86)\WiX Toolset v3.11\bin") {
            echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $env:GITHUB_PATH
          }
      - name: Install frontend deps
        run: pnpm install --no-frozen-lockfile
      - name: Build frontend
        run: pnpm build
      - name: Install Tauri CLI
        run: cargo install tauri-cli
      - name: Build Tauri app (Windows)
        run: cargo tauri build --verbose
      - name: Find Windows installers
        id: find_installers
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path ./src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $exe = Get-ChildItem -Path ./src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if ($msi) { echo "msi_path=$msi" >> $env:GITHUB_OUTPUT }
          if ($exe) { echo "exe_path=$exe" >> $env:GITHUB_OUTPUT }
      - name: Upload Windows MSI
        if: steps.find_installers.outputs.msi_path != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.find_installers.outputs.msi_path }}
          asset_name: 悦诉客服_${{ github.ref_name }}_windows.msi
          asset_content_type: application/octet-stream
      - name: Upload Windows NSIS
        if: steps.find_installers.outputs.exe_path != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.find_installers.outputs.exe_path }}
          asset_name: 悦诉客服_${{ github.ref_name }}_windows.exe
          asset_content_type: application/octet-stream
